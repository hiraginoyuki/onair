[server]
bind = "127.0.0.1:8080"
request_body_limit_bytes = 2097152
# Only trust Forwarded/X-Forwarded-For/X-Real-IP from these immediate peer CIDRs.
trusted_proxy_cidrs = []

[telemetry]
service_name = "onair"
# "none" by default. Use "otlp" to export OpenTelemetry metrics to an OTLP collector.
exporter = "none"
# otlp_endpoint = "http://127.0.0.1:4317"
export_interval_ms = 30000

[debug_capture]
# Dangerous: captures exact prompt/request bodies to local files. Enable only while reproducing.
enabled = false
# Use "failures" for safer diagnosis of upstream 400/422 responses; use "all" to capture successes too.
mode = "failures"
directory = "onair-debug-captures"

[inspector]
# Disabled by default. When enabled, serves a local request/timing Web UI at /_onair/inspector.
enabled = false
retention_requests = 10000
# Keep false unless the onair bind address is protected by another access-control layer.
# When false, trusted forwarded headers must still resolve to a loopback effective client.
allow_remote = false

[health]
# Disabled by default because probes send requests to each configured backend.
active = false
interval_ms = 30000
timeout_ms = 2000
path = "/v1/models"

[routing]
# Use "sticky" when multiple matching backends should share load while preserving prompt-cache affinity.
strategy = "priority"
# Extra compatible backends to try after a pre-response connect/send/timeout failure. Set 0 to disable.
fallback_attempts = 1

[access]
# Every configured client receives these public models in addition to its own models.
default_models = ["gpt-4o-mini"]

[[client]]
id = "dev"
# API keys are exact-match bearer tokens. See README.md for the recommended key shape.
api_key = "replace-with-generated-onair-client-key"
models = ["gpt-4o"]

[[backend]]
id = "local-vllm"
base_url = "http://127.0.0.1:8000"
# api_key_env = "LOCAL_VLLM_API_KEY"
# Optional backend-level value for model routes that use context_length = "inherit".
context_length = 131072
# Use ["all", "streaming"] for a backend that should receive any native OpenAI-compatible /v1/* route it supports.
# Compatibility routes require explicit markers:
# - "responses_via_chat_completions" for client /v1/responses -> upstream /v1/chat/completions.
# - "chat_completions_via_responses" for client /v1/chat/completions -> upstream /v1/responses.
# Add "tools" here, and to a model route's endpoints when endpoints is non-empty, only if that backend/template supports function tools.
# Optional: tool_schema_mode = "llamacpp_compat" can relax converted Responses tool schemas for llama.cpp chat templates.
# Optional: responses_store = "force_false" adds store=false to upstream Responses requests when clients omit it.
# Optional: responses_max_output_tokens = "drop" removes upstream Responses max_output_tokens for wrappers that reject it.
# Optional: chat_stream_usage = "insert" asks Chat Completions backends for streaming usage chunks when clients omitted it.
# Use "force_true" only if operator telemetry should override explicit client include_usage=false.
capabilities = ["chat", "responses", "streaming"]
timeout_ms = 120000

# Model routes are optional for model-less endpoints, but required for model-bearing requests and /v1/models output.
[[backend.model]]
public = "gpt-4o-mini"
backend = "llama-3.1-8b-instruct"
# Optional: "none" or omitted hides it, "inherit" uses backend.context_length, or use an integer.
context_length = "inherit"
endpoints = ["chat", "responses"]
# endpoints = ["chat", "responses", "tools"] # if this model route supports function tools

[[backend.model]]
public = "gpt-4o"
backend = "llama-3.1-70b-instruct"
endpoints = ["chat"]
# endpoints = ["chat", "tools"] # if this chat-compat route supports function tools
# endpoints = ["responses_via_chat_completions"] # client /v1/responses -> upstream /v1/chat/completions
# tool_schema_mode = "llamacpp_compat" # optional per-model override for Responses-to-Chat tool schemas
# responses_store = "force_false" # optional per-model override for upstream Responses wrappers that require it
# responses_max_output_tokens = "drop" # optional per-model override for upstream Responses wrappers that reject max_output_tokens
# chat_stream_usage = "insert" # optional per-model override for Chat Completions stream usage requests

# Example for a Responses-native backend exposed to Chat Completions clients:
# [[backend]]
# id = "responses-wrapper"
# base_url = "http://127.0.0.1:8001"
# capabilities = ["responses", "streaming", "tools"]
#
# [[backend.model]]
# public = "gpt-4o"
# backend = "backend-responses-model"
# endpoints = ["chat_completions_via_responses", "tools"]
