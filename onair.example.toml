[server]
bind = "127.0.0.1:8080"
# Maximum accepted request body size in bytes. Captured at router construction;
# hot reload does not change it — restart onair to apply a new value.
request_body_limit_bytes = 2097152
# Only trust Forwarded/X-Forwarded-For/X-Real-IP from these immediate peer CIDRs.
trusted_proxy_cidrs = []

[telemetry]
service_name = "onair"
# "none" by default. Use "otlp" to export OpenTelemetry metrics to an OTLP collector.
exporter = "none"
# otlp_endpoint = "http://127.0.0.1:4317"
export_interval_ms = 30000

[debug_capture]
# Dangerous: captures exact prompt/request bodies to local files. Enable only while reproducing.
enabled = false
# Use "failures" for safer diagnosis of upstream 400/422 responses; use "all" to capture successes too.
mode = "failures"
directory = "onair-debug-captures"

[inspector]
# Disabled by default. When enabled, serves a local request/timing Web UI at /_onair/inspector.
enabled = false
retention_requests = 10000
# Keep false unless the onair bind address is protected by another access-control layer.
# When false, trusted forwarded headers must still resolve to a loopback effective client.
allow_remote = false

[inspector.persistence]
# Disabled by default. When enabled, restores the latest retained inspector records after restart.
enabled = false
# Use a private, ignored local path. SQLite sidecar files may be created next to this file.
# path = ".local/inspector.sqlite"
# Maximum time the persistence writer will spend draining its queue on shutdown
# before dropping any remaining records. Must be in 1..=60000.
# drain_timeout_ms = 500

[health]
# Disabled by default because probes send requests to each configured backend.
active = false
interval_ms = 30000
timeout_ms = 2000
path = "/v1/models"

[routing]
# Use "sticky" to keep prompt-cache-affinity on one backend per key.
# Use "round_robin" to cycle the primary backend per model across matching backends.
# Use "weighted_random" to bias primary selection with [[backend]].weight values.
strategy = "priority"
# Extra compatible backends to try after a pre-response connect/send/timeout failure. Set 0 to disable.
fallback_attempts = 1
# Behavior when [[backend]].supports or [[route]].expose contain a string the
# router does not recognize (for example a typo'd "responses_via_chat_completion").
# Default is "warn" (load succeeds, log a warning at load and reload time). Use
# "error" to refuse to load the config until the unknown marker is fixed.
unknown_capability_policy = "warn"
unknown_endpoint_policy = "warn"

[access]
# Every configured client receives these public models in addition to its own models.
default_models = ["gpt-4o-mini"]

[[client]]
id = "dev"
# API keys are exact-match bearer tokens. See README.md for the recommended key shape.
api_key = "replace-with-generated-onair-client-key"
models = ["gpt-4o"]

# A `[[backend]]` block is a physical upstream. `supports` lists what the upstream
# can receive; `[[route]]` blocks (below) decide what the proxy actually exposes.
[[backend]]
id = "local-vllm"
base_url = "http://127.0.0.1:8000"
# api_key_env = "LOCAL_VLLM_API_KEY"
# Use ["all", "streaming"] for a backend that should receive any native OpenAI-compatible /v1/* route it supports.
# Compatibility routes require explicit markers:
# - "responses_via_chat_completions" for client /v1/responses -> upstream /v1/chat/completions.
# - "chat_completions_via_responses" for client /v1/chat/completions -> upstream /v1/responses.
# Typos in support or expose marker names are reported at load and reload time.
# The default policy is "warn" (log only). Set the routing policies above to
# "error" to fail to load when a marker is not recognized.
# Add "tools" here, and to a [[route]]'s expose list when expose is non-empty, only if that backend/template supports function tools.
# Optional: tool_schema_mode = "llamacpp_compat" can relax converted Responses tool schemas for llama.cpp chat templates.
# Optional: responses_store = "force_false" adds store=false to upstream Responses requests when clients omit it.
# Optional: responses_max_output_tokens = "drop" removes upstream Responses max_output_tokens for wrappers that reject it.
# Optional: chat_stream_usage = "insert" asks Chat Completions backends for streaming usage chunks for metrics; injected usage chunks are filtered unless the client requested include_usage.
# Use "force_true" only if operator telemetry should override explicit client include_usage=false upstream; client responses still honor the original opt-in.
# Optional: extra_body = { reasoning_split = true } merges arbitrary fields into the
# upstream request body. Route-level extra_body overrides backend-level on key
# conflict. See docs/configuration.md#upstream-request-body-overrides for the
# protected-key list and merge rules.
# Optional: stream_capture = true records per-event upstream_response.ndjson
# and client_response.ndjson for streaming requests, with per-event ts_us and a
# timings summary in metadata.json. Default false. See
# docs/observability.md#streaming-debug-capture.
supports = ["chat", "responses", "streaming"]
timeout_ms = 120000

# A `[[route]]` block declares one public-facing model (or path) and the backends
# that can serve it. Each entry in `backends` is either "model@backend" (upstream
# model name `model` served by backend `backend`) for model-bearing routes, or a
# bare backend id for model-less routes. The order of `backends` is priority order
# when several compatible backends match; the same order also seeds the fallback list.
# `expose` lists the client API surfaces this public model accepts. It can further
# restrict the route to endpoint keys such as `chat`, `chat_completions`,
# `responses`, `responses_via_chat_completions`, `chat_completions_via_responses`,
# `embeddings`, plus feature markers such as `tools`. If omitted or empty, the
# route is allowed for native endpoints and feature markers supported by the
# backend; compatibility still requires an exact compatibility marker.
[[route]]
public = "gpt-4o-mini"
expose = ["chat", "responses"]
backends = ["llama-3.1-8b-instruct@local-vllm"]
context_length = "upstream"
# Optional: extra_body = { reasoning_split = true, temperature = 0.7 } merges
# arbitrary fields into the upstream request body for this route only.
# Route-level extra_body overrides backend-level on key conflict. See
# docs/configuration.md#upstream-request-body-overrides for the protected-key
# list and merge rules.
# Optional: expose_backend_errors = true forwards non-2xx upstream error bodies
# to the client (status mapped through ApiError::upstream, body capped at 1 MiB,
# strict header allowlist). Default false. See
# docs/configuration.md#exposing-backend-errors and docs/security.md.
# Optional: stream_capture = true records per-event upstream_response.ndjson
# and client_response.ndjson for streaming requests to this route, with
# per-event ts_us and a timings summary in metadata.json. Default false
# (route inherits the bound backend's value). See
# docs/observability.md#streaming-debug-capture.
# expose = ["chat", "responses", "tools"] # if this route supports function tools

[[route]]
public = "gpt-4o"
expose = ["chat"]
backends = ["llama-3.1-70b-instruct@local-vllm"]
# expose = ["chat", "tools"] # if this chat-compat route supports function tools
# expose = ["responses_via_chat_completions"] # client /v1/responses -> upstream /v1/chat/completions
# tool_schema_mode = "llamacpp_compat" # optional per-route override for Responses-to-Chat tool schemas
# responses_store = "force_false" # optional per-route override for upstream Responses wrappers that require it
# responses_max_output_tokens = "drop" # optional per-route override for upstream Responses wrappers that reject max_output_tokens
# chat_stream_usage = "insert" # optional per-route override for Chat Completions stream usage requests

# Model-less route: a `path = "..."` block exposes a non-model endpoint (such as
# /v1/embeddings) to clients. The entries in `backends` are bare backend ids
# (no `@`) because there is no model name to bind.
[[route]]
path = "/v1/embeddings"
expose = ["embeddings"]
backends = ["local-vllm"]

# Example for a Responses-native backend exposed to Chat Completions clients:
# [[backend]]
# id = "responses-wrapper"
# base_url = "http://127.0.0.1:8001"
# supports = ["responses", "streaming", "tools"]
#
# [[route]]
# public = "gpt-4o"
# expose = ["chat_completions_via_responses", "tools"]
# backends = ["backend-responses-model@responses-wrapper"]

# # ======================================================================
# Example Anthropic Messages API route; safe to delete if not used.
# # ======================================================================
# This block is fully commented out. Uncomment to expose an
# Anthropic-native backend (such as llama.cpp server with the
# /v1/messages endpoint enabled, or a remote Anthropic-format
# service) under an onair public model. onair accepts
# Anthropic-format POST /v1/messages requests, rewrites the public
# model name to the backend model, fills missing max_tokens from
# `anthropic_max_tokens`, injects `anthropic-version: 2023-06-01`
# when the client omits it, rewrites the model back on responses
# (sync + streaming SSE), and emits Anthropic-format errors on
# onair-generated failure paths.
#
# Inbound auth accepts both `Authorization: Bearer <token>` and
# `x-api-key: <key>`; `Authorization: Bearer` wins when both are
# present. `/v1/messages/count_tokens` returns 404 in Anthropic
# error format until the full implementation lands.
#
# The compat counterpart `messages_via_chat_completions`
# (Anthropic client -> OpenAI Chat backend) is reserved for an
# upcoming release; routes carrying that marker currently produce
# an `endpoint_unavailable` error.
#
# Required config: declare a `[[client]]` whose model whitelist
# contains "claude-local" (or extend `[access].default_models`).
# See docs/configuration.md#anthropic-messages-api for the full
# field semantics and resolution order.
#
# [[backend]]
# id = "local-llama"
# base_url = "http://127.0.0.1:8080"
# # `messages` admits client /v1/messages to the backend.
# # Add "streaming" and "tools" if the backend supports them.
# supports = ["messages", "streaming", "tools"]
# # Upstream auth: either set api_key_env (sent as Authorization: Bearer)
# # or inject anthropic-version / x-api-key via [route.request_headers] below.
# # api_key_env = "LOCAL_LLAMA_API_KEY"
# timeout_ms = 120000
#
# [[route]]
# public = "claude-local"
# expose = ["messages"]
# backends = ["llama-3.1-8b-instruct@local-llama"]
# # Default max_tokens when the client omits it (Anthropic requires
# # the field). If both are missing, onair returns 400 invalid_request_error
# # in Anthropic error format.
# anthropic_max_tokens = 4096
# # Optional per-route upstream header overrides. Useful for
# # `anthropic-version` (overrides the default 2023-06-01 and the
# # client value) and `x-api-key` (sends a backend-specific key).
# # Header names and values are validated at config load.
# [route.request_headers]
# # anthropic-version = "2023-06-01"
# # x-api-key = "backend-specific-key"
