<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>onair inspector</title>
  <style>
__ONAIR_INSPECTOR_CSS__
  </style>
</head>
<body>
  <header>
    <h1>onair inspector</h1>
    <span class="status"><span id="dot" class="dot"></span><span id="status">connecting</span></span>
    <span id="count" class="status">0 requests</span>
    <div class="toolbar">
      <div class="toolbar-row">
        <input id="filter" type="search" autocomplete="off" spellcheck="false" aria-describedby="filter-help" placeholder="filter terms, e.g. backend-a timeout" title="Filter uses space-separated terms; every term must match route, identity, models, backend, client addresses, user-agent, outcome, or attempt metadata.">
        <details class="toolbar-menu columns">
          <summary title="Show or hide request table columns">columns</summary>
          <div id="columnOptions" class="menu-panel column-options"></div>
        </details>
        <details class="toolbar-menu presets">
          <summary title="Save and restore local table views">views</summary>
          <div id="presetOptions" class="menu-panel preset-options"></div>
        </details>
        <button id="pause" type="button" title="Pause or resume applying live SSE updates to the table">pause</button>
        <button id="reload" type="button">reload</button>
      </div>
      <div id="quickFilters" class="toolbar-row quick-filters" aria-label="quick filters"></div>
      <div id="filter-help" class="toolbar-help">Filter uses space-separated terms; every term must match route, identity, models, backend, client, user-agent, outcome, or attempt metadata.</div>
    </div>
  </header>
  <main>
    <section class="table-wrap">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty">Waiting for requests…</div>
    </section>
    <section class="detail">
      <div id="overview"></div>
      <div id="detail">
        <div class="empty">Select a request to inspect timings and metadata.</div>
      </div>
    </section>
  </main>
  <script>
__ONAIR_INSPECTOR_JS__
  </script>
</body>
</html>
