name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'unstable'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.1.0 or unstable). Defaults to "unstable".'
        required: false
        default: 'unstable'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  meta:
    name: resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      is_unstable: ${{ steps.resolve.outputs.is_unstable }}
      is_stable: ${{ steps.resolve.outputs.is_stable }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi
          cargo_version="$(grep -E '^version' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$tag" = "unstable" ]; then
            is_unstable="true"
            is_stable="false"
            prerelease="true"
            version="${cargo_version}"
          elif [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            is_unstable="false"
            is_stable="true"
            prerelease="false"
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            echo "Unsupported tag: $tag" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "is_unstable=$is_unstable"
            echo "is_stable=$is_stable"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$tag version=$version unstable=$is_unstable stable=$is_stable"

  build:
    name: build ${{ matrix.target }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            method: native
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            method: zigbuild
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            method: zigbuild
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            method: zigbuild
          - target: x86_64-apple-darwin
            os: macos-15-intel
            method: native
          - target: aarch64-apple-darwin
            os: macos-14
            method: native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig
        if: ${{ matrix.method == 'zigbuild' }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: ${{ matrix.method == 'zigbuild' }}
        run: cargo install --locked cargo-zigbuild

      - name: Install musl tools
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (native)
        if: ${{ matrix.method == 'native' }}
        run: cargo build --release --target ${{ matrix.target }} -p onair --locked

      - name: Build (zigbuild)
        if: ${{ matrix.method == 'zigbuild' }}
        run: cargo zigbuild --release --target ${{ matrix.target }} -p onair --locked

      - name: Stage binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/onair dist/onair-${{ matrix.target }}
          chmod +x dist/onair-${{ matrix.target }}
          file dist/onair-${{ matrix.target }} || true
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: onair-${{ matrix.target }}
          path: dist/onair-${{ matrix.target }}
          if-no-files-found: error

  licenses:
    name: generate THIRD_PARTY_LICENSES.md
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-about
        run: cargo install --locked cargo-about --features cli

      - name: Generate THIRD_PARTY_LICENSES.md
        run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.md

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: THIRD_PARTY_LICENSES
          path: THIRD_PARTY_LICENSES.md
          if-no-files-found: error

  release:
    name: publish release
    needs: [meta, build, licenses]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la dist/

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/onair-x86_64-unknown-linux-gnu
            dist/onair-x86_64-unknown-linux-musl
            dist/onair-aarch64-unknown-linux-gnu
            dist/onair-aarch64-unknown-linux-musl
            dist/onair-x86_64-apple-darwin
            dist/onair-aarch64-apple-darwin
            dist/THIRD_PARTY_LICENSES.md

  nix-metadata:
    name: update nix-metadata
    needs: [meta, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Enable flakes
        run: |
          mkdir -p ~/.config/nix
          printf 'experimental-features = nix-command flakes\n' >> ~/.config/nix/nix.conf

      - name: Compute sha256 for each release asset
        id: hashes
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          targets=(
            x86_64-unknown-linux-gnu
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-gnu
            aarch64-unknown-linux-musl
            x86_64-apple-darwin
            aarch64-apple-darwin
          )
          hash_obj="{"
          first=true
          for t in "${targets[@]}"; do
            url="https://github.com/${REPO}/releases/download/${TAG}/onair-${t}"
            nix_hash=$(nix-prefetch-url --type sha256 "$url")
            sha=$(nix hash convert --to sri --hash-algo sha256 "$nix_hash")
            printf '%s -> %s\n' "$t" "$sha"
            if [ "$first" = "true" ]; then first=false; else hash_obj+=","; fi
            hash_obj+="\"${t}\":\"${sha}\""
          done
          hash_obj+="}"
          {
            echo "hashes<<EOF"
            echo "$hash_obj"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update flake.nix with new version, tag, and hashes
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          HASHES: ${{ steps.hashes.outputs.hashes }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          new_version = os.environ["VERSION"]
          new_tag = os.environ["TAG"]
          new_hashes = json.loads(os.environ["HASHES"])

          with open("flake.nix") as f:
              content = f.read()

          def replace_scalar(content, name, value, label):
              pattern = re.compile(
                  rf'({re.escape(name)}\s*=\s*)"[^"]*"\s*;',
                  re.MULTILINE,
              )
              new_content, n = pattern.subn(
                  lambda m: f'{m.group(1)}"{value}";',
                  content,
                  count=1,
              )
              if n != 1:
                  sys.exit(f"{label} replacement failed (matched {n} times)")
              return new_content

          content = replace_scalar(content, "version", new_version, "version")
          content = replace_scalar(content, "tag", new_tag, "tag")

          hashes_lines = [
              "        " + f'"{k}" = "{v}";'
              for k, v in new_hashes.items()
          ]
          hashes_block = "{\n" + "\n".join(hashes_lines) + "\n      }"
          pattern = re.compile(
              r'hashes\s*=\s*\{[^}]*\}\s*;',
              re.DOTALL,
          )
          new_content, n = pattern.subn(
              f'hashes = {hashes_block};',
              content,
              count=1,
          )
          if n != 1:
              sys.exit(f"hashes replacement failed (matched {n} times)")

          with open("flake.nix", "w") as f:
              f.write(new_content)
          print("flake.nix updated successfully")
          PY

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push updated flake.nix
        run: |
          set -euo pipefail
          git add flake.nix
          if git diff --cached --quiet; then
            echo "No changes to flake.nix; skipping commit"
          else
            git commit -m "chore(release): record ${TAG} in flake.nix [skip ci]"
            git push origin main
          fi

      - name: Push release tag
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -f "$TAG"
          git push origin "tag" "$TAG" --force

      - name: Push moving tags (vX, latest) for stable releases
        if: ${{ needs.meta.outputs.is_stable == 'true' }}
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          major="v$(echo "$VERSION" | cut -d. -f1)"
          git tag -f "$major" "$TAG"
          git push origin "tag" "$major" --force
          git tag -f "latest" "$TAG"
          git push origin "tag" "latest" --force

      - name: Force-push unstable tag to main HEAD
        if: ${{ needs.meta.outputs.is_unstable == 'true' }}
        run: |
          set -euo pipefail
          git tag -f unstable main
          git push origin "tag" unstable --force
