name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/onair -> target

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: protocol JSON syntax
        run: find protocol -name '*.json' -print0 | xargs -0 jq empty

      - name: protocol alpha conformance and selected OnAir parity
        run: cargo test -p llm-protocol-core -p llm-protocol-openai -p llm-protocol-anthropic -p llm-protocol-onair-parity --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo build (release)
        run: cargo build --release -p onair --locked

      - name: cargo test
        run: cargo test --workspace --locked
